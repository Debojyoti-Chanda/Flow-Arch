<!DOCTYPE html>
<html>

<head>
    <title>IFS Flow Mind Map</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <header>
        <h1>Architecture Flow Explorer</h1>
        <button id="reset-btn" aria-label="Reset" title="Reset" style="position: absolute; top: 18px; right: 32px; background: #fff; color: #c62828; border: none; font-size: 1.7rem; border-radius: 50%; width: 38px; height: 38px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; z-index: 1100; display: flex; align-items: center; justify-content: center; transition: background 0.2s;">
            &#10005;
        </button>
    </header>
    <!-- Sidebar for search and info panel -->
    <div id="sidebar" >
        <button id="sidebar-toggle" aria-label="Toggle Sidebar">⬅️</button>

        <div class="sidebar-content">
            <!-- <div class="explorer-header">
                <h2>IFS Explorer</h2>
                <p class="subtitle">Architecture Flow Navigation</p>
            </div> -->

            <div class="search-section">

                <div class="input-group">
                    <label for="search-input">Search Application</label>
                    <div class="search-wrapper">
                        <input type="text" id="search-input" placeholder="Type name & press Enter...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>

                <div class="input-group">
                    <label for="filename-input">Search Filename</label>
                    <div class="search-wrapper">
                        <input type="text" id="filename-input" placeholder="Type filename & press Enter...">
                        <span class="search-icon">📄</span>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="org-filter">Domain</label>
                    <select id="org-filter" class="filter-select">
                        <option value="all">All Domains</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="team-filter">Team</label>
                    <select id="team-filter" class="filter-select">
                        <option value="all">All Teams</option>
                    </select>
                </div>

                <div class="search-footer">
                    <span id="match-count" class="match-badge"></span>
                </div>
            </div>

            <div id="info-panel">
                <div class="info-header">
                    <h3>Node Details</h3>
                </div>
                <div id="info-content">
                    <p class="placeholder">Click a node to explore the specific data flow sequence.</p>
                </div>
            </div>
        </div>

    </div>
    <!-- Main container for the mind map -->
    <div id="mindmap-container">
        <svg id="mindmap"></svg>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
